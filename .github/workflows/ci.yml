name: UniVet CI/CD

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: python init_db.py

      - name: Validate syntax
        run: python -m py_compile app.py init_db.py run_server.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  postgres:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PostgreSQL HTTP tests in isolated containers
        env:
          UNIVET_TEST_POSTGRES: "1"
          PYTHONPATH: tests
        run: python -m unittest test_postgres.PostgresHTTPTests -v

      - name: Run PostgreSQL stock and concurrency tests in isolated containers
        env:
          UNIVET_TEST_POSTGRES: "1"
          PYTHONPATH: tests
        run: python -m unittest test_postgres.PostgresStockTests test_postgres.PostgresConcurrencyTests -v

  deploy:
    name: Smoke do demo publicado
    needs: [test, postgres]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar demo no PythonAnywhere
        env:
          DEMO_BASE_URL: https://bugijo.pythonanywhere.com
        run: |
          for path in /health /login /; do
            curl --fail --silent --show-error --location --retry 2 --max-time 30 \
              --output /dev/null "$DEMO_BASE_URL$path"
            echo "HTTP 200: $path"
          done
