{% extends "base.html" %}
{% block title %}UniVet | {{ acao }}{% endblock %}
{% block content %}
    <section class="page-header"><div><span class="eyebrow">Estoque</span><h1>{{ acao }}</h1><p>Atualize os dados de contato do fornecedor.</p></div><a class="btn btn-secondary" href="{{ url_for('listar_fornecedores_page') }}">Voltar</a></section>
    <section class="card form-card wide-form"><div class="card-body"><form method="post" class="form-grid two-columns"><div class="field-group"><label for="nome">Nome</label><input id="nome" name="nome" value="{{ fornecedor['nome'] if fornecedor else '' }}" required></div><div class="field-group"><label for="documento">Documento</label><input id="documento" name="documento" value="{{ fornecedor['documento'] if fornecedor else '' }}"></div><div class="field-group"><label for="telefone">Telefone</label><input id="telefone" name="telefone" value="{{ fornecedor['telefone'] if fornecedor else '' }}"></div><div class="field-group"><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ fornecedor['email'] if fornecedor else '' }}"></div><div class="field-group full-width"><label for="endereco">Endereço</label><input id="endereco" name="endereco" value="{{ fornecedor['endereco'] if fornecedor else '' }}"></div><div class="actions full-width"><button class="btn" type="submit">Salvar fornecedor</button><a class="btn btn-secondary" href="{{ url_for('listar_fornecedores_page') }}">Cancelar</a></div></form></div></section>
{% endblock %}
