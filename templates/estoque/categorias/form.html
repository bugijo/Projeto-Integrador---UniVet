{% extends "base.html" %}
{% block title %}UniVet | {{ acao }}{% endblock %}
{% block content %}
    <section class="page-header"><div><span class="eyebrow">Estoque</span><h1>{{ acao }}</h1><p>Atualize o agrupamento usado nos filtros do estoque.</p></div><a class="btn btn-secondary" href="{{ url_for('listar_categorias_page') }}">Voltar</a></section>
    <section class="card form-card"><div class="card-body"><form method="post" class="form-grid"><div class="field-group"><label for="nome">Nome</label><input id="nome" name="nome" value="{{ categoria['nome'] if categoria else '' }}" required></div><div class="field-group"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" class="compact-textarea">{{ categoria['descricao'] if categoria else '' }}</textarea></div><div class="actions"><button class="btn" type="submit">Salvar categoria</button><a class="btn btn-secondary" href="{{ url_for('listar_categorias_page') }}">Cancelar</a></div></form></div></section>
{% endblock %}
