{% extends "base.html" %}

{% block title %}UniVet | Entrada de lote{% endblock %}

{% block content %}
    <section class="page-header"><div><span class="eyebrow">Estoque</span><h1>Registrar entrada</h1><p>Cada entrada cria um lote rastreável para o produto.</p></div><a class="btn btn-secondary" href="{{ url_for('listar_lotes_page') }}">Ver lotes</a></section>
    <section class="card form-card"><div class="card-body"><form method="post" class="form-grid two-columns">
        <div class="field-group"><label for="produto_id">Produto</label><select id="produto_id" name="produto_id" required><option value="">Selecione um produto</option>{% for produto in produtos %}<option value="{{ produto['id'] }}" {% if dados.get('produto_id')|string == produto['id']|string %}selected{% endif %}>{{ produto['nome'] }}{% if produto['codigo'] %} · {{ produto['codigo'] }}{% endif %}</option>{% endfor %}</select></div>
        <div class="field-group"><label for="fornecedor_id">Fornecedor</label><select id="fornecedor_id" name="fornecedor_id"><option value="">Não informado</option>{% for fornecedor in fornecedores %}<option value="{{ fornecedor['id'] }}" {% if dados.get('fornecedor_id')|string == fornecedor['id']|string %}selected{% endif %}>{{ fornecedor['nome'] }}</option>{% endfor %}</select></div>
        <div class="field-group"><label for="numero_lote">Número do lote</label><input id="numero_lote" name="numero_lote" value="{{ dados.get('numero_lote', '') }}" placeholder="Ex.: 2026-001" required></div>
        <div class="field-group"><label for="quantidade">Quantidade</label><input id="quantidade" name="quantidade" type="number" min="0.01" step="0.01" value="{{ dados.get('quantidade', '') }}" required></div>
        <div class="field-group"><label for="validade">Validade</label><input id="validade" name="validade" type="date" value="{{ dados.get('validade', '') }}"><span class="field-help">Lotes sem validade não são priorizados pelo FEFO.</span></div>
        <div class="field-group"><label for="valor_compra_unitario">Valor de compra unitário</label><input id="valor_compra_unitario" name="valor_compra_unitario" type="number" min="0" step="0.01" value="{{ dados.get('valor_compra_unitario', '0') }}" placeholder="0,00"></div>
        <div class="field-group" style="grid-column: 1 / -1;"><label for="motivo">Motivo</label><input id="motivo" name="motivo" value="{{ dados.get('motivo', 'Compra') }}" required></div>
        <div class="actions" style="grid-column: 1 / -1;"><button class="btn" type="submit">Registrar entrada</button><a class="btn btn-secondary" href="{{ url_for('listar_lotes_page') }}">Cancelar</a></div>
    </form></div></section>
{% endblock %}
