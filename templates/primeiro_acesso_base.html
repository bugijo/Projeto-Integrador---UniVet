<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UniVet | Primeiro acesso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="welcome-body">
<main class="welcome-shell" id="main-content">
    <section class="welcome-card">
        <strong>UniVet</strong>
        {% if config.UNIVET_ENV == 'demo' %}<p>Ambiente de demonstração — dados fictícios</p>{% endif %}
        {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="flash-item {{ category }}" role="status">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
        <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn secondary" type="submit">Encerrar sessão</button>
        </form>
    </section>
</main>
</body>
</html>
